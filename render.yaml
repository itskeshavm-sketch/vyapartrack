services:
  - type: web
    name: vyapartrack
    runtime: node
    rootDir: .
    plan: free
    buildCommand: npm install --no-audit --no-fund
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: API_TOKEN
        generateValue: true
      - key: AUTO_REPLY
        value: "false"
    disk:
      name: vyapar-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
