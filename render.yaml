services:
  - type: web
    name: vyapartrack
    runtime: node
    rootDir: .
    plan: free
    buildCommand: npm install --no-audit --no-fund
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: POOLSIDE_API_KEY
        sync: false
      - key: POOLSIDE_MODEL
        value: poolside/laguna-xs-2.1
      - key: POOLSIDE_BASE_URL
        value: https://inference.poolside.ai/v1
      - key: API_TOKEN
        generateValue: true
      - key: AUTO_REPLY
        value: "true"
    disk:
      name: vyapar-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
