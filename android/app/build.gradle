plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vyapartrack.app'
    compileSdk 35
    // No native code. Pure Java + WebView. Guaranteed to run on any device.

    defaultConfig {
        applicationId 'com.vyapartrack.app'
        minSdk 24
        targetSdk 34
        versionCode 289
        versionName '2.9.0-white'
    }

    // Stable signing key so a new APK installs over the previous one
    // instead of asking the user to uninstall first.
    signingConfigs {
        def ksPath = System.getenv('VT_KS_FILE')
        if (ksPath && file(ksPath).exists()) {
            create('vt') {
                storeFile = file(ksPath)
                storePassword = System.getenv('VT_KS_PASS')
                keyAlias = 'vyapartrack'
                keyPassword = System.getenv('VT_KS_PASS')
                storeType = 'pkcs12'
            }
        }
    }

    buildTypes {
        debug {
            if (signingConfigs.findByName('vt') != null) {
                signingConfig signingConfigs.vt
            }
        }
        release {
            minifyEnabled false
            if (signingConfigs.findByName('vt') != null) {
                signingConfig signingConfigs.vt
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Native-script parser strings require UTF-8 source decoding.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation files('libs/wabridge-classes.jar')
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
