plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vyapartrack.app'
    compileSdk 36
    // No native code. Pure Java + WebView. Guaranteed to run on any device.

    defaultConfig {
        applicationId 'com.vyapartrack.app'
        minSdk 24
        targetSdk 34
        versionCode 286
        versionName '2.8.6-phone'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Native-script parser strings require UTF-8 source decoding.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation files('libs/wabridge-classes.jar')
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
