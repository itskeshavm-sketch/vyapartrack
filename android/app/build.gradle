plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vyapartrack.app'
    compileSdk 36
    // No native code. Pure Java + WebView. Guaranteed to run on any device.

    defaultConfig {
        applicationId 'com.vyapartrack.app'
        minSdk 24
        targetSdk 34
        versionCode 264
        versionName '2.6.4'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
